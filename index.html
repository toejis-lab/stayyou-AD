  --bg:#eef1f2; --surface:#ffffff; --surface-2:#f6f8f8;
  --primary:#0f4c4a; --primary-d:#0a3634; --primary-l:#e3efee;
  --ink:#152625; --muted:#6b7d7b; --line:#e2e8e7;
  --green:#15803d; --green-bg:#e7f4ec;
  --amber:#b45309; --amber-bg:#fbf1e2;
  --red:#c2321f; --red-bg:#fbeae7;
  --gray:#94a3a1; --gray-bg:#eef1f1;
  --shadow:0 1px 2px rgba(15,45,44,.06),0 6px 20px rgba(15,45,44,.06);
  --r:16px; --r-sm:11px;
  --nav-h:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  background:var(--bg); color:var(--ink);
  font-size:15px; line-height:1.5; letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:16px}
h1,h2,h3,p{margin:0}
.hidden{display:none!important}

/* Header */
header{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(180deg,var(--primary),var(--primary-d));
  color:#fff; padding:calc(env(safe-area-inset-top) + 14px) 18px 16px;
  box-shadow:0 2px 14px rgba(10,54,52,.18);
}
.hd-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hd-title{display:flex;align-items:center;gap:10px}
.hd-mark{width:32px;height:32px;border-radius:9px;background:var(--logo) center/cover no-repeat;
  box-shadow:0 0 0 1px rgba(255,255,255,.12) inset}
.hd-title h1{font-size:17px;font-weight:700;letter-spacing:-.02em}
.hd-title span{display:block;font-size:11px;color:rgba(255,255,255,.72);font-weight:500;margin-top:1px}
.hd-btn{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.14);
  display:grid;place-items:center;font-size:18px}
.hd-btn:active{background:rgba(255,255,255,.26)}
.sync-dot{display:inline-flex;align-items:center;gap:5px;font-size:11px;
  color:rgba(255,255,255,.8);background:rgba(255,255,255,.12);
  padding:4px 9px;border-radius:20px;font-weight:500;margin-top:12px}
.sync-dot i{width:7px;height:7px;border-radius:50%;background:#7ee0a1;display:inline-block}
.sync-dot.local i{background:#f6c760}

/* Layout */
main{max-width:640px;margin:0 auto;padding:16px 14px 24px}
.view{animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.section-label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.02em;
  margin:22px 4px 10px;text-transform:none;display:flex;align-items:center;justify-content:space-between}
.section-label:first-child{margin-top:4px}

/* Cards */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}

/* Summary cards */
.stat{padding:16px 15px;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat .k{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:7px}
.stat .v{font-size:23px;font-weight:800;letter-spacing:-.03em;line-height:1}
.stat .v small{font-size:14px;font-weight:700;color:var(--muted);margin-left:2px}
.stat .sub{font-size:11.5px;color:var(--muted);margin-top:6px;font-weight:500}
.stat.accent{background:linear-gradient(155deg,var(--primary),var(--primary-d));color:#fff}
.stat.accent .k{color:rgba(255,255,255,.72)}
.stat.accent .sub{color:rgba(255,255,255,.7)}
.stat.warn .v{color:var(--red)}
.stat .tag{position:absolute;top:14px;right:14px;font-size:16px;opacity:.5}

/* Month switcher */
.month-nav{display:flex;align-items:center;justify-content:center;gap:6px;
  background:var(--surface);border-radius:14px;padding:6px;box-shadow:var(--shadow);margin-bottom:4px}
.month-nav button{width:40px;height:38px;border-radius:10px;font-size:20px;color:var(--primary);font-weight:600}
.month-nav button:active{background:var(--primary-l)}
.month-nav .mlabel{flex:1;text-align:center;font-size:16px;font-weight:700;letter-spacing:-.02em}
.month-nav .mlabel small{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:1px}

/* Rows / list items */
.row{display:flex;align-items:center;gap:12px;padding:14px 15px;background:var(--surface);
  border-radius:var(--r-sm);box-shadow:var(--shadow);margin-bottom:9px;text-align:left;width:100%}
.row:active{background:var(--surface-2)}
.rowtap{flex:1;display:flex;align-items:center;gap:12px;min-width:0;text-align:left;background:none}
.rowtap:active{opacity:.7}
.qbtn{flex-shrink:0;padding:10px 15px;border-radius:11px;background:var(--primary-l);color:var(--primary);font-weight:700;font-size:13.5px}
.qbtn:active{background:var(--primary);color:#fff}
.qbtn.cancel{background:var(--red-bg,#fdecec);color:var(--red)}
.qbtn.cancel:active{background:var(--red);color:#fff}
.row .avatar{width:42px;height:42px;border-radius:11px;flex-shrink:0;display:grid;place-items:center;
  font-weight:800;font-size:15px;color:#fff;letter-spacing:-.03em}
.row .body{flex:1;min-width:0}
.row .name{font-weight:700;font-size:15px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .right{text-align:right;flex-shrink:0}
.row .amt{font-weight:800;font-size:15px;letter-spacing:-.02em}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;
  padding:3px 9px;border-radius:20px;letter-spacing:-.01em}
.badge.green{background:var(--green-bg);color:var(--green)}
.badge.amber{background:var(--amber-bg);color:var(--amber)}
.badge.red{background:var(--red-bg);color:var(--red)}
.badge.gray{background:var(--gray-bg);color:var(--muted)}
.adstart-line{color:var(--primary);font-weight:600;white-space:normal;overflow:visible}

.empty{text-align:center;padding:48px 24px;color:var(--muted)}
.empty .ic{font-size:40px;margin-bottom:12px;opacity:.7}
.empty h3{font-size:16px;color:var(--ink);margin-bottom:6px;font-weight:700}
.empty p{font-size:13.5px;line-height:1.55}

.filter-chips{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;padding:2px}
.chip{white-space:nowrap;font-size:13px;font-weight:600;padding:8px 14px;border-radius:20px;
  background:var(--surface);color:var(--muted);box-shadow:var(--shadow)}
.chip.on{background:var(--primary);color:#fff}

/* Bar chart */
.chart{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 16px 12px}
.bars{display:flex;align-items:flex-end;gap:9px;height:150px;margin-top:8px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar{width:100%;max-width:34px;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,var(--primary),#1c6f6a);min-height:3px;transition:height .4s ease}
.bar-lbl{font-size:10.5px;color:var(--muted);font-weight:600}
.bar-val{font-size:9.5px;color:var(--muted);font-weight:600}
.bar-stack{width:100%;max-width:34px;display:flex;flex-direction:column;justify-content:flex-end;border-radius:6px 6px 3px 3px;overflow:hidden;min-height:3px;transition:height .4s ease}
.bar-stack .seg-ad{width:100%;background:linear-gradient(180deg,var(--primary),#1c6f6a)}
.bar-stack .seg-ex{width:100%;background:linear-gradient(180deg,#e0a44e,#c78a3b)}
.chart-legend{display:flex;gap:16px;justify-content:center;margin-top:13px;font-size:11.5px;color:var(--muted);font-weight:600}
.chart-legend span{display:inline-flex;align-items:center;gap:5px}
.chart-legend i{width:9px;height:9px;border-radius:3px;flex-shrink:0}

/* FAB */
.fab{position:fixed;right:calc(50% - 320px + 20px);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);
  z-index:45;width:56px;height:56px;border-radius:18px;background:var(--primary);color:#fff;
  box-shadow:0 6px 20px rgba(15,76,74,.4);display:grid;place-items:center;font-size:28px;font-weight:300}
.fab:active{transform:scale(.94)}
@media(max-width:680px){.fab{right:20px}}

/* 부수작업 (extras) */
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:2px}
.cat-cell{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 15px}
.cat-top{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--ink)}
.cat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cat-amt{font-size:18px;font-weight:800;letter-spacing:-.02em;margin-top:8px}
.cat-amt small{font-size:12px;font-weight:700;color:var(--muted);margin-left:2px}
.cat-cnt{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:3px}
.chip-sep{width:1px;background:var(--line);margin:3px 2px;flex-shrink:0}
.ex-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.ex-item{display:flex;align-items:center;gap:11px;padding:11px 13px;background:var(--surface);border-radius:var(--r-sm);box-shadow:var(--shadow);text-align:left;width:100%}
.ex-item:active{background:var(--surface-2)}
.ex-ic{width:34px;height:34px;border-radius:9px;flex-shrink:0;display:grid;place-items:center;font-size:16px}
.ex-b{flex:1;min-width:0;display:flex;flex-direction:column}
.ex-t{font-weight:700;font-size:14px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex-s{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex-r{text-align:right;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;font-weight:800;font-size:14px}

/* Bottom nav */
nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(255,255,255,.94);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);display:flex;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--gray);font-size:10.5px;font-weight:600;letter-spacing:-.01em}
.nav-btn svg{width:23px;height:23px;stroke-width:2}
.nav-btn.on{color:var(--primary)}

/* Modal */
.modal-bg{position:fixed;inset:0;z-index:60;background:rgba(12,32,31,.42);
  backdrop-filter:blur(2px);display:flex;align-items:flex-end;justify-content:center;
  animation:fade .2s ease}
.modal{background:var(--surface);width:100%;max-width:640px;border-radius:22px 22px 0 0;
  max-height:92vh;overflow-y:auto;animation:slideup .28s cubic-bezier(.2,.9,.3,1);
  padding-bottom:calc(env(safe-area-inset-bottom) + 8px)}
@keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
.modal-hd{position:sticky;top:0;background:var(--surface);padding:16px 20px 12px;
  display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);z-index:2}
.modal-hd h2{font-size:17px;font-weight:700}
.modal-hd .x{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-size:18px;color:var(--muted)}
.modal-body{padding:18px 20px 8px}
.grabber{width:38px;height:4px;border-radius:3px;background:var(--line);margin:8px auto 0}

.field{margin-bottom:16px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:7px;letter-spacing:-.01em}
.field input,.field select,.field textarea{width:100%;padding:13px 14px;border:1.5px solid var(--line);
  border-radius:12px;background:var(--surface-2);color:var(--ink);transition:border-color .15s;
  font-size:16px;font-family:inherit}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary);background:#fff}
.field textarea{resize:none;min-height:64px;line-height:1.5}
.field .hint{font-size:11.5px;color:var(--muted);margin-top:6px}
.field.money input{font-weight:700;font-variant-numeric:tabular-nums}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:12px;border-radius:11px;background:var(--surface-2);border:1.5px solid var(--line);
  font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--primary-l);border-color:var(--primary);color:var(--primary)}

.btn{display:block;width:100%;padding:15px;border-radius:14px;font-size:16px;font-weight:700;text-align:center}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:active{background:var(--primary-d)}
.btn-ghost{background:var(--surface-2);color:var(--muted)}
.btn-danger{background:var(--red-bg);color:var(--red)}
.btn-row{display:flex;gap:10px;margin-top:6px}
.btn-row .btn{margin-top:0}

/* Detail rows in client modal */
.dl{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.dl:last-child{border:none}
.dl .k{color:var(--muted);font-weight:600}
.dl .v{font-weight:700}
.pay-item{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.pay-item:last-child{border:none}
.pay-item .pi-l .m{font-weight:700;font-size:14px}
.pay-item .pi-l .d{font-size:12px;color:var(--muted);margin-top:2px}
.pay-item .pi-r{text-align:right;display:flex;align-items:center;gap:10px}
.pay-item .del{color:var(--red);font-size:13px;font-weight:600;padding:4px 6px}

/* 빠른 금액 버튼 (분할 입력) */
.quick-amt{display:flex;gap:8px;margin-top:9px}
.quick-amt button{flex:1;padding:9px;border-radius:10px;background:var(--primary-l);color:var(--primary);
  font-weight:700;font-size:13px}
.quick-amt button:active{background:var(--primary);color:#fff}

/* 미납 일괄 완납 버튼 */
.btn.settle-all{background:var(--green-bg);color:var(--green);font-weight:700;font-size:14px;
  padding:13px;border-radius:12px;margin-bottom:12px;box-shadow:none}
.btn.settle-all:active{background:var(--green);color:#fff}

/* 월별 정산 보드 */
.mboard{display:flex;flex-direction:column;gap:9px}
.mb-row{background:var(--surface-2);border-radius:12px;overflow:hidden;
  border:1px solid var(--line);border-left:3px solid var(--gray)}
.mb-row.green{border-left-color:var(--green)}
.mb-row.amber{border-left-color:var(--amber)}
.mb-row.red{border-left-color:var(--red)}
.mb-head{display:flex;align-items:center;justify-content:space-between;gap:10px;
  width:100%;padding:12px 14px;text-align:left;background:none}
.mb-head:active{background:rgba(0,0,0,.03)}
.mb-l{min-width:0}
.mb-month{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:7px}
.mb-note{font-size:11.5px;color:var(--muted);margin-top:3px;font-weight:600}
.mb-r{text-align:right;flex-shrink:0}
.mb-paid,.mb-bill{font-size:13.5px;font-weight:700}
.mb-bill{color:var(--muted)}
.mb-remain{font-size:12px;font-weight:700;color:var(--primary);margin-top:3px}
.mb-row.amber .mb-remain{color:var(--amber)}
.mb-inst{border-top:1px dashed var(--line);padding:6px 14px 8px;background:rgba(255,255,255,.5)}
.mb-inst-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 0}
.mb-inst-l{font-size:12px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mb-inst-l b{color:var(--ink)}
.mb-inst-r{display:flex;align-items:center;gap:8px;flex-shrink:0}
.mb-inst-r .num{font-weight:700;font-size:13px}
.mb-del{color:var(--red);font-size:13px;font-weight:700;padding:3px 6px;line-height:1}
/* 월별 정산 보드 중복 경고 배너 */
.mb-dup{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--red);
  background:var(--red-bg);padding:7px 14px;border-top:1px dashed var(--line)}

/* 입금현황 목록 · 펜션별 입금 처리 날짜 */
.row .paydate{font-size:11.5px;color:var(--primary);margin-top:3px;font-weight:600;
  white-space:normal;line-height:1.45}
.row .paydate.dup{color:var(--red)}
.dup-tag{display:inline-flex;align-items:center;gap:3px;background:var(--red-bg);
  color:var(--red);border-radius:6px;padding:1px 7px;font-size:10.5px;font-weight:800;margin-left:5px}

/* 입금 달력 */
.cal-nav{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.cal-nav button{width:38px;height:38px;border-radius:11px;background:var(--surface-2);
  font-size:20px;color:var(--ink);flex-shrink:0}
.cal-nav button:active{background:var(--primary-l)}
.cal-nav .cal-title{flex:1;text-align:center;font-weight:700;font-size:15.5px;letter-spacing:-.02em}
.cal-sum{text-align:center;font-size:12.5px;color:var(--muted);margin-bottom:12px;font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:2px 0}
.cal-dow.sun{color:var(--red)} .cal-dow.sat{color:#1e5f8c}
.cal-cell{min-height:58px;border-radius:9px;background:var(--surface-2);padding:3px 3px 4px;
  display:flex;flex-direction:column;gap:2px;border:1.5px solid transparent}
.cal-cell.empty{background:none;border:none}
.cal-cell .d{font-size:10.5px;font-weight:700;color:var(--muted);text-align:right;line-height:1;padding:0 1px 1px}
.cal-cell.today{border-color:var(--primary)}
.cal-cell.today .d{color:var(--primary)}
.cal-cell.has{background:var(--primary-l)}
.cal-cell.dup{background:var(--red-bg);border-color:var(--red)}
.cal-amt{font-size:10px;font-weight:800;color:var(--primary);text-align:center;background:#fff;
  border-radius:5px;padding:2px 1px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-amt:active{background:var(--primary);color:#fff}
.cal-cell.dup .cal-amt{color:var(--red)}
.cal-more{font-size:9px;color:var(--muted);text-align:center;font-weight:700}

/* 달력 아래 입금 내역 목록 */
.pe-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:12px 14px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;margin-bottom:8px}
.pe-row:active{background:var(--surface-2)}
.pe-row.dup{border-color:var(--red)}
.pe-body{flex:1;min-width:0}
.pe-date{font-weight:700;font-size:14px;display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.pe-sub{font-size:11.5px;color:var(--muted);margin-top:3px;white-space:normal;line-height:1.4}
.pe-amt{font-weight:800;font-size:15px;flex-shrink:0;color:var(--ink)}
.pe-amt small{font-size:11px;font-weight:700;color:var(--muted);margin-left:1px}

/* 정산 점검 진단 */
.diag-alert{background:var(--red-bg);color:var(--red);border:1.5px solid var(--red);font-weight:800}
.diag-alert:active{background:var(--red);color:#fff}
.diag-card{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 15px;margin-bottom:11px}
.diag-card.warn{border-color:var(--red)}
.diag-name{font-weight:800;font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:7px}
.diag-name .avatar{border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:800;flex-shrink:0}
.diag-line{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;color:var(--muted)}
.diag-line b{color:var(--ink);font-weight:700}
.diag-note{font-size:12.5px;line-height:1.5;background:var(--amber-bg);color:#7a5200;border-radius:9px;padding:9px 11px;margin:9px 0}
.diag-note b{color:var(--red)}
.diag-fix{width:100%;margin-top:4px;padding:11px;border-radius:11px;background:var(--primary-l);color:var(--primary);font-weight:700;font-size:13.5px}
.diag-fix:active{background:var(--primary);color:#fff}

.toast{position:fixed;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 20px);left:50%;
  transform:translateX(-50%);background:var(--primary-d);color:#fff;padding:12px 20px;border-radius:14px;
  font-size:14px;font-weight:600;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.25);
  animation:toastin .3s ease;max-width:88%;text-align:center}
@keyframes toastin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

/* Lock screen */
.lock{position:fixed;inset:0;z-index:200;background:linear-gradient(165deg,var(--primary),var(--primary-d));
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top) + 20px) 28px;color:#fff}
.lock .lk-mark{width:64px;height:64px;border-radius:18px;background:var(--logo) center/cover no-repeat;
  box-shadow:0 4px 16px rgba(0,0,0,.2);margin-bottom:20px}
.lock h2{font-size:19px;font-weight:700;letter-spacing:-.02em}
.lock p{font-size:13.5px;color:rgba(255,255,255,.7);margin-top:6px;margin-bottom:30px}
.lk-dots{display:flex;gap:15px;margin-bottom:8px;height:18px;align-items:center}
.lk-dots span{width:15px;height:15px;border-radius:50%;border:2px solid rgba(255,255,255,.5);transition:.15s}
.lk-dots span.on{background:#fff;border-color:#fff}
.lk-dots.err{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.lk-msg{font-size:13px;color:#ffd7cf;height:18px;margin-bottom:24px;font-weight:600}
.lk-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;width:100%;max-width:280px}
.lk-key{aspect-ratio:1.5;border-radius:16px;background:rgba(255,255,255,.13);font-size:24px;font-weight:600;
  color:#fff;display:grid;place-items:center;transition:.1s}
.lk-key:active{background:rgba(255,255,255,.3);transform:scale(.95)}
.lk-key.blank{background:none;pointer-events:none}
.lk-key.act{font-size:15px;font-weight:600}
.loading{display:grid;place-items:center;padding:60px;color:var(--muted)}
.spinner{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--primary);
  border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== v2.0 월간 작업 관리 ===== */
.pbar{height:7px;border-radius:5px;background:var(--gray-bg);overflow:hidden;margin-top:8px}
.pbar i{display:block;height:100%;border-radius:5px;background:var(--primary);transition:width .35s ease}
.pbar i.green{background:var(--green)} .pbar i.amber{background:#d08a2c} .pbar i.red{background:var(--red)} .pbar i.gray{background:var(--gray)}
.pbar.light{background:rgba(255,255,255,.22)} .pbar.light i{background:#fff}
.ichips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.ichip{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:7px;white-space:nowrap}
.ichip.green{background:var(--green-bg);color:var(--green)}
.ichip.amber{background:var(--amber-bg);color:var(--amber)}
.ichip.red{background:var(--red-bg);color:var(--red)}
.ichip.gray{background:var(--gray-bg);color:var(--muted)}
.wk-row{align-items:flex-start;border-left:4px solid var(--gray)}
.wk-row.green{border-left-color:var(--green)} .wk-row.amber{border-left-color:#d08a2c} .wk-row.red{border-left-color:var(--red)}
.wk-row .name{white-space:normal}
.legend-row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;font-size:11.5px;color:var(--muted);font-weight:600;margin:12px 0 4px}
.legend-row span{display:inline-flex;align-items:center;gap:5px}
.legend-row i{width:9px;height:9px;border-radius:3px}

/* 작업 상세 시트 */
.ws-unit{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:9px}
.ws-unit.done{background:var(--green-bg);border-color:#cfe8d8}
.ws-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px;font-size:14px}
.ws-meta{font-size:11px;color:var(--muted);font-weight:600;text-align:right}
.stseg{display:flex;gap:4px}
.stseg button{flex:1;padding:10px 2px;border-radius:9px;background:#fff;border:1.5px solid var(--line);font-size:12.5px;font-weight:700;color:var(--muted)}
.stseg button.past{border-color:#b9d6d3;color:var(--primary)}
.stseg button.on{background:var(--primary);border-color:var(--primary);color:#fff}
.ws-unit.done .stseg button.on{background:var(--green);border-color:var(--green)}
.ws-bot{display:flex;gap:6px;margin-top:8px;align-items:center}
.mini-sel,.mini-in{min-width:0;padding:9px 10px;border:1.5px solid var(--line);border-radius:9px;background:#fff;font-size:14px;font-family:inherit;color:var(--ink)}
.mini-sel{flex:0 0 auto;max-width:42%}
.mini-in{flex:1}
.mini-go{flex-shrink:0;font-size:13px;font-weight:700;color:var(--primary);padding:9px 8px;text-decoration:none}

/* 촬영 일정 */
.sh-row{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:9px}
.sh-row.done{background:var(--green-bg);border-color:#cfe8d8}
.sh-l{font-size:14px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sh-in{display:flex;gap:6px}
.sh-in input{flex:1;min-width:0;padding:10px;border:1.5px solid var(--line);border-radius:9px;background:var(--surface-2);font-family:inherit;font-size:15px;color:var(--ink)}
.sh-in input[type=time]{flex:0 0 31%}
.sh-done{flex-shrink:0;padding:0 12px;border-radius:9px;background:var(--primary-l);color:var(--primary);font-weight:700;font-size:13px}
.sh-done.on{background:#fff;color:var(--muted);border:1.5px solid var(--line)}

/* 직원 화면 */
body.staff{padding-bottom:calc(env(safe-area-inset-bottom) + 24px)}
body.staff nav{display:none}
.hero{background:linear-gradient(155deg,var(--primary),var(--primary-d));color:#fff;border-radius:var(--r);padding:18px 18px 16px;box-shadow:var(--shadow)}
.hero-k{font-size:13px;font-weight:600;color:rgba(255,255,255,.78)}
.hero-v{margin-top:8px;display:flex;align-items:baseline;gap:8px}
.hero-v .num{font-size:42px;font-weight:800;letter-spacing:-.04em;line-height:1}
.hero-v small{font-size:14px;font-weight:600;color:rgba(255,255,255,.8)}
.hero-s{font-size:12.5px;color:rgba(255,255,255,.78);margin-top:9px;font-weight:600}
.stabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:14px 0 10px}
.stabs button{background:var(--surface);box-shadow:var(--shadow);border-radius:13px;padding:10px 2px 9px;font-size:13px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.stabs button b{font-size:19px;color:var(--ink);font-weight:800;line-height:1.1}
.stabs button.alert b{color:var(--red)}
.stabs button.on{background:var(--primary);color:rgba(255,255,255,.85)}
.stabs button.on b{color:#fff}
.stab-hint{font-size:12.5px;color:var(--muted);margin:0 4px 12px;line-height:1.5}
.ucard{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.ucard.done{opacity:.75}
.uc-hd{display:flex;align-items:center;gap:11px;width:100%;padding:13px 14px;text-align:left;border-bottom:1px solid var(--line)}
.uc-hd:active{background:var(--surface-2)}
.uc-hd .avatar{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:800;flex-shrink:0}
.uc-hd .body{flex:1;min-width:0}
.uc-hd .name{font-weight:800;font-size:15.5px;letter-spacing:-.02em}
.uc-hd .meta{font-size:12px;color:var(--muted);margin-top:1px;font-weight:600}
.uc-more{font-size:12.5px;font-weight:700;color:var(--primary);flex-shrink:0}
.urow{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.urow:last-child{border-bottom:none}
.ur-l{flex:1;min-width:0}
.ur-name{font-weight:700;font-size:15px}
.ur-st{font-size:12px;color:var(--muted);margin-top:3px;font-weight:600}
.stp{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--gray-bg);color:var(--muted);font-weight:700}

const VAT_RATE=0.1;
const vatOf = fee => Math.round((+fee||0)*VAT_RATE);
const withVat = fee => (+fee||0) + vatOf(fee);   // 부가세 포함 청구액(완납 기준)
const billOf = c => withVat(c && c.monthlyFee);
function formatPhone(v){
  let d=String(v||'').replace(/[^0-9]/g,'').slice(0,11);
  if(!d) return '';
  if(d.startsWith('02')){
    if(d.length<=2) return d;
    if(d.length<=5) return d.replace(/(\d{2})(\d+)/,'$1-$2');
    if(d.length<=9) return d.replace(/(\d{2})(\d{3,4})(\d+)/,'$1-$2-$3');
    return d.replace(/(\d{2})(\d{4})(\d{4})/,'$1-$2-$3');
  }
  if(d.length<=3) return d;
  if(d.length<=7) return d.replace(/(\d{3})(\d+)/,'$1-$2');
  if(d.length<=10) return d.replace(/(\d{3})(\d{3})(\d+)/,'$1-$2-$3');
  return d.replace(/(\d{3})(\d{4})(\d{4})/,'$1-$2-$3');
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const pad = n => String(n).padStart(2,'0');
const todayISO = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const nowMonth = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };
const mKey = iso => iso ? iso.slice(0,7) : nowMonth();
const mLabel = m => { const [y,mo]=m.split('-'); return `${y}년 ${+mo}월`; };
const mShort = m => { const [,mo]=m.split('-'); return `${+mo}월`; };
const addMonth = (m,delta) => { let [y,mo]=m.split('-').map(Number); mo-=1+ -delta; const d=new Date(y,mo,1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };
function monthsBetween(from,to){ // inclusive list of 'YYYY-MM'
  const out=[]; let cur=from;
  let guard=0;
  while(cur<=to && guard<600){ out.push(cur); cur=addMonth(cur,1); guard++; }
  return out;
}

/* ---------- Billing logic ---------- */
function isActiveInMonth(c,m){
  const start=mKey(c.contractDate);
  if(m<start) return false;
  if(c.status==='ended' && c.endDate){ if(m>mKey(c.endDate)) return false; }
  return true;
}
function paidForClientMonth(clientId,m){
  return state.payments.filter(p=>p.clientId===clientId && p.targetMonth===m).reduce((a,p)=>a+(+p.amount||0),0);
}
// Due months for a client, from contract month up to min(now, end)
function dueMonths(c){
  const start=mKey(c.contractDate);
  let end=nowMonth();
  if(c.status==='ended' && c.endDate){ const em=mKey(c.endDate); if(em<end) end=em; }
  if(start>end) return [];
  return monthsBetween(start,end);
}
function statusOf(c,m){ // for a specific due month — 부가세 포함 기준
  const fee=withVat(c.monthlyFee);       // 완납 기준 = 부가세 포함
  const supply=+c.monthlyFee||0;         // 공급가
  const paid=paidForClientMonth(c.id,m);
  if(paid<=0) return {s:'미납',cls:'red',paid,fee,supply};
  if(paid<fee) return {s:'부분',cls:'amber',paid,fee,supply};
  return {s:'완납',cls:'green',paid,fee,supply};
}
function clientArrears(c){ // total unpaid up to now — 부가세 포함 기준
  let due=0,paid=0;
  for(const m of dueMonths(c)){ due+=withVat(c.monthlyFee); paid+=paidForClientMonth(c.id,m); }
  return Math.max(0, due-paid);
}
function monthTotals(m){
  const active=state.clients.filter(c=>isActiveInMonth(c,m));
  const supply=active.reduce((a,c)=>a+(+c.monthlyFee||0),0);   // 공급가 합계
  const vat=active.reduce((a,c)=>a+vatOf(c.monthlyFee),0);      // 부가세 합계
  const expected=supply+vat;                                   // 부가세 포함 총 청구액
  const paid=state.payments.filter(p=>p.targetMonth===m).reduce((a,p)=>a+(+p.amount||0),0);
  return {active,expected,supply,vat,paid,unpaid:Math.max(0,expected-paid)};
}
function remainingForMonth(c,m){ return Math.max(0, withVat(c.monthlyFee)-paidForClientMonth(c.id,m)); }
// 계약월~현재까지 월별 정산 현황 (최신월 우선). 각 월의 분할 입금 내역 포함
function clientMonthBoard(c){
  const bill=withVat(c.monthlyFee);
  return dueMonths(c).slice().reverse().map(m=>{
    const installments=state.payments.filter(p=>p.clientId===c.id && p.targetMonth===m)
      .sort((a,b)=>(a.payDate||'').localeCompare(b.payDate||'')||(a.createdAt||0)-(b.createdAt||0));
    const paid=installments.reduce((a,p)=>a+(+p.amount||0),0);
    const remain=Math.max(0,bill-paid);
    let cls='red',s='미납';
    if(bill>0 && paid>=bill){cls='green';s='완납';}
    else if(paid>0){cls='amber';s='부분';}
    // 중복 의심: 같은 금액이 2건 이상 입력됨
    const _cnt={}; installments.forEach(p=>{const k=+p.amount||0; if(k>0)_cnt[k]=(_cnt[k]||0)+1;});
    const dup=Object.values(_cnt).some(n=>n>=2);
    return {m,bill,paid,remain,cls,s,installments,dup};
  });
}
// 'YYYY-MM-DD' → 'M/D'
function mmdd(iso){ return iso ? `${+iso.slice(5,7)}/${+iso.slice(8,10)}` : ''; }
function adStartLabel(iso){
  if(!iso) return '광고 시작일이 등록되어 있지 않습니다';
  const [y,mo,d]=iso.split('-').map(Number);
  return `${y}년 ${mo}월 ${d}일 광고 시작`;
}
// 달력 칸용 축약 금액: 110000 → 11만, 88000 → 8.8만, 5000 → 5천
function wonShort(n){
  n=+n||0;
  if(n>=10000){ const m=n/10000; return (Number.isInteger(m)?m:+m.toFixed(1))+'만'; }
  if(n>=1000){ const k=n/1000; return (Number.isInteger(k)?k:+k.toFixed(1))+'천'; }
  return String(n);
}
// 특정 거래처+월의 입금 건들(날짜순)과 '중복 의심' 정보 — 같은 금액이 2건 이상이면 중복 의심
function monthPayList(clientId,m){
  const pays=state.payments.filter(p=>p.clientId===clientId && p.targetMonth===m)
    .sort((a,b)=>(a.payDate||'').localeCompare(b.payDate||'')||(a.createdAt||0)-(b.createdAt||0));
  const cnt={};
  pays.forEach(p=>{ const k=+p.amount||0; if(k>0) cnt[k]=(cnt[k]||0)+1; });
  const dupAmts=new Set(Object.keys(cnt).filter(k=>cnt[k]>=2).map(Number));
  return {pays, dup:dupAmts.size>0, dupAmts};
}

const EXTRA_CATS = [
  {v:'사진',   emoji:'📷', color:'#1e5f8c'},

  {v:'디자인', emoji:'🎨', color:'#7a5230'},

];
const catMeta = v => EXTRA_CATS.find(c=>c.v===v) || {v:v||'기타', emoji:'🧾', color:'#6b7d7b'};
const extraVat  = e => (e && e.vatMode==='add') ? Math.round((+e.amount||0)*VAT_RATE) : 0;
const extraBill = e => (+((e&&e.amount)||0)) + extraVat(e);   // 부가세 포함 청구액
function extraTotals(list){
  list = list || state.extras;
  const bill = list.reduce((a,e)=>a+extraBill(e),0);
  const paid = list.filter(e=>e.status==='paid').reduce((a,e)=>a+extraBill(e),0);
  return {count:list.length, bill, paid, unpaid:Math.max(0,bill-paid)};
}
function extraByCat(list){
  list = list || state.extras;
  const map={};
  list.forEach(e=>{
    const k = catMeta(e.category).v;
    (map[k]=map[k]||{cat:k, count:0, bill:0});
    map[k].count++; map[k].bill+=extraBill(e);
  });
  return Object.values(map).sort((a,b)=>b.bill-a.bill);
}
function exFeeText(amount, vatMode){
  const v=+amount||0;
  if(!v) return '금액(공급가)을 입력하세요. ‘부가세 별도’ 선택 시 10%가 더해집니다.';
  if(vatMode==='none') return `<b style="color:var(--primary)">청구액 ${won(v)}원</b> · 부가세 없음`;
  return `부가세 ${won(Math.round(v*VAT_RATE))}원 · <b style="color:var(--primary)">청구액 ${won(v+Math.round(v*VAT_RATE))}원</b>`;
}

  refreshWorkModal();

/* ============================================================
   정산 점검 — 이번 달 미입금 vs 누적 미수금 차이 원인 진단
   ============================================================ */
function settlementCheck(){
  const m=state.month, now=nowMonth();
  const monthAhead = m>now;   // 보고 있는 정산 기준월이 실제 현재 달보다 미래
  const flagged=[];
  for(const c of state.clients){
    if(!isActiveInMonth(c,m)) continue;
    if(statusOf(c,m).s==='완납') continue;
    const bill=withVat(c.monthlyFee);
    const thisShort=Math.max(0, bill - paidForClientMonth(c.id,m));
    if(thisShort<=0) continue;
    const arr=clientArrears(c);
    // 이번 달 부족액이 '누적 미수'보다 크다 = 이미 낸 돈이 다른 달에 잡혀 있다는 신호
    if(arr < thisShort){
      const over=dueMonths(c).map(mm=>({m:mm, excess:paidForClientMonth(c.id,mm)-bill}))
        .filter(x=>x.excess>0).sort((a,b)=>b.excess-a.excess);
      const future=state.payments.filter(p=>p.clientId===c.id && p.targetMonth && p.targetMonth>now)
        .map(p=>({id:p.id, m:p.targetMonth, amt:+p.amount||0}));
      flagged.push({c, thisShort, arr, gap:thisShort-arr, bill, over, future});
    }
  }
  flagged.sort((a,b)=>b.gap-a.gap);
  return {m, now, monthAhead, flagged, gapTotal:flagged.reduce((a,x)=>a+x.gap,0)};
}

    <div class="diag-line"><span>이번 달(${mLabel(dg.m)}) 미입금</span><b>${won(unpaid)}원</b></div>

    body+=`<div class="diag-note" style="background:var(--red-bg);color:var(--red)">

  if(dg.flagged.length){
    body+=`<div class="section-label" style="margin:6px 0 10px">대상월 확인 필요 <span>${dg.flagged.length}곳 · 합계 ${won(dg.gapTotal)}원</span></div>`;
    body+=dg.flagged.map(f=>{
      const parked = [
        ...f.over.map(o=>`${mLabel(o.m)}에 <b>초과 ${won(o.excess)}원</b>`),

      return `<div class="diag-card warn">

        <div class="diag-line"><span>이번 달(${mLabel(dg.m)}) 미입금</span><b style="color:var(--red)">${won(f.thisShort)}원</b></div>
        <div class="diag-line"><span>이 거래처 누적 미수</span><b>${won(f.arr)}원</b></div>
        <div class="diag-note">

        </div>

      </div>`;

        대상월이 잘못 지정된 입금은 발견되지 않았습니다. 이번 달 미입금이 누적 미수보다 크다면, 이번 달에 초과 입금한 거래처가 있어 전체 합계가 상쇄된 경우일 수 있어요.</div>`;

    }

function viewStats(){
  if(state.clients.length===0) return emptyState();
  const curY=String(new Date().getFullYear());
  const months=[]; let cur=nowMonth();
  for(let i=5;i>=0;i--) months.push(addMonth(cur,-i));

  const paidExtras=state.extras.filter(e=>e.status==='paid');
  const exMonth=e=>(e.payDate||e.workDate||'').slice(0,7);   // 실제 입금월(없으면 작업월)

  // 월별: 광고 입금(대상월 기준) + 부수작업 입금완료(입금월 기준)
  const data=months.map(m=>{
    const ad=state.payments.filter(p=>p.targetMonth===m).reduce((a,p)=>a+(+p.amount||0),0);
    const ex=paidExtras.filter(e=>exMonth(e)===m).reduce((a,e)=>a+extraBill(e),0);
    return {m, ad, ex, val:ad+ex};
  });
  const max=Math.max(1,...data.map(d=>d.val));

  // 합산 수입 = 광고 입금 + 부수작업 입금완료 (부가세 포함 · 실입금 기준)
  const adYear=state.payments.filter(p=>(p.targetMonth||'').startsWith(curY)).reduce((a,p)=>a+(+p.amount||0),0);
  const adAll =state.payments.reduce((a,p)=>a+(+p.amount||0),0);
  const exYear=paidExtras.filter(e=>exMonth(e).startsWith(curY)).reduce((a,e)=>a+extraBill(e),0);
  const exAll =paidExtras.reduce((a,e)=>a+extraBill(e),0);
  const revYear=adYear+exYear, revAll=adAll+exAll;
  const et=extraTotals();
  const exUnpaidCnt=state.extras.filter(e=>e.status!=='paid').length;

  // per client cumulative (광고 입금)
  const perClient=state.clients.map(c=>({c,total:state.payments.filter(p=>p.clientId===c.id).reduce((a,p)=>a+(+p.amount||0),0),ar:clientArrears(c)}))
    .sort((a,b)=>b.total-a.total);

  return `<div class="view">
    <div class="stat accent" style="margin-top:2px">
      <div class="k">${curY}년 총 수입 (부가세 포함 · 입금 기준)</div>
      <div class="v num">${won(revYear)}<small>원</small></div>
      <div class="sub">광고비 ${won(adYear)} · 부수작업 ${won(exYear)}</div>

function saveExtraForm(){
  const clientId=$('#ex-client').value;
  if(!clientId){ toast('거래처를 선택하세요'); return; }
  const amount=parseWon($('#ex-amount').value);
  if(!amount){ toast('금액을 입력하세요'); return; }
  const id=$('#ex-id').value||uid();
  const status=$('#ex-statusv').value||'unpaid';
  const createdRaw=$('#ex-created').value;
  const e={
    id, clientId,
    workDate:$('#ex-date').value||todayISO(),
    category:$('#ex-catsel').value||'기타',
    title:$('#ex-title').value.trim(),
    amount,
    vatMode:$('#ex-vatv').value||'add',
    status,
    payDate: status==='paid' ? ($('#ex-paydate')?.value||todayISO()) : '',
    method:  status==='paid' ? ($('#ex-method')?.value||'계좌이체') : '',
    memo:$('#ex-memo').value.trim(),
    createdAt: createdRaw?+createdRaw:Date.now()
  };
  // 즉시 반영 (Firebase 지연 대비)
  const i=state.extras.findIndex(x=>x.id===id); if(i<0) state.extras.push(e); else state.extras[i]=e;
  Store.saveExtra(e);
  const back=extraReturnClient; extraReturnClient=null;
  closeModal(); render(); toast(createdRaw?'저장되었습니다':'부수작업이 등록되었습니다');
  if(back){ setTimeout(()=>{ const c=state.clients.find(x=>x.id===back); if(c) showClientDetail(c); },140); }
}

/* ============================================================
   입금 달력 (펜션별 입금 처리 날짜 시각화 + 개별 수정/삭제)
   ============================================================ */
let openCalId=null;      // 현재 열려있는 입금 달력의 거래처 id
let openCalMonth=null;   // 현재 보고 있는 달력 월 'YYYY-MM'
let editReturn=null;     // 입금 수정 폼에서 돌아갈 달력 컨텍스트

function openPaymentCalendar(clientId, month){
  const c=state.clients.find(x=>x.id===clientId); if(!c) return;
  if(!month){
    const inSel=state.payments.some(p=>p.clientId===clientId && (p.payDate||'').slice(0,7)===state.month);
    if(inSel) month=state.month;
    else{
      const ds=state.payments.filter(p=>p.clientId===clientId && p.payDate).map(p=>p.payDate.slice(0,7)).sort();
      month = ds.length ? ds[ds.length-1] : (state.month||nowMonth());
    }
  }
  openModal(paymentCalendar(c, month));   // openModal이 내부에서 closeModal 호출 → 마커는 그 뒤에 설정
  openCalId=clientId; openCalMonth=month; openDetailId=null;
}

function paymentCalendar(c, month){
  const [y,mo]=month.split('-').map(Number);
  const startDow=new Date(y,mo-1,1).getDay();     // 0=일
  const daysInMonth=new Date(y,mo,0).getDate();
  const monthPays=state.payments
    .filter(p=>p.clientId===c.id && (p.payDate||'').slice(0,7)===month)
    .sort((a,b)=>(a.payDate||'').localeCompare(b.payDate||'')||(a.createdAt||0)-(b.createdAt||0));
  const byDay={};
  monthPays.forEach(p=>{ const d=+(p.payDate||'').slice(8,10); (byDay[d]=byDay[d]||[]).push(p); });
  const monthTotal=monthPays.reduce((a,p)=>a+(+p.amount||0),0);
  const todayStr=todayISO();

  let cells='';
  for(let i=0;i<startDow;i++) cells+=`<div class="cal-cell empty"></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const iso=`${month}-${pad(d)}`;
    const entries=byDay[d]||[];
    const has=entries.length>0;
    const dupDay=entries.length>=2;   // 같은 날 2건 이상 → 중복 의심
    let chips='';
    entries.slice(0,2).forEach(p=>{
      chips+=`<button class="cal-amt" data-action="editpay" data-id="${p.id}">${wonShort(p.amount)}</button>`;
    });
    if(entries.length>2) chips+=`<div class="cal-more">+${entries.length-2}건</div>`;
    cells+=`<div class="cal-cell ${has?'has':''} ${dupDay?'dup':''} ${iso===todayStr?'today':''}">
      <div class="d">${d}</div>${chips}</div>`;
  }

  const listHtml = monthPays.length
    ? monthPays.map(p=>{
        const dupRow=(byDay[+(p.payDate||'').slice(8,10)]||[]).length>=2;
        return `<button class="pe-row ${dupRow?'dup':''}" data-action="editpay" data-id="${p.id}">
          <div class="pe-body">
            <div class="pe-date">${p.payDate||'-'} 입금${dupRow?`<span class="dup-tag">⚠ 같은 날 중복</span>`:''}</div>
            <div class="pe-sub">광고 ${p.targetMonth?mLabel(p.targetMonth):'-'}분${p.method?' · '+esc(p.method):''}${p.memo?' · '+esc(p.memo):''} · 눌러서 수정</div>
          </div>
          <div class="pe-amt num">${won(p.amount)}<small>원</small></div>
        </button>`;
      }).join('')
    : `<div style="text-align:center;color:var(--muted);padding:22px;font-size:13px">이 달에 입금 처리된 내역이 없습니다</div>`;

  return `
  <div class="modal-hd"><h2>${esc(c.name)} · 입금 달력</h2><button class="x" data-action="close">✕</button></div>
  <div class="modal-body">
    <div class="cal-nav">
      <button data-action="calprev">‹</button>
      <div class="cal-title">${mLabel(month)}</div>
      <button data-action="calnext">›</button>
    </div>
    <div class="cal-sum">이 달 입금 처리 <b style="color:var(--primary)">${won(monthTotal)}원</b> · ${monthPays.length}건 <span style="color:var(--muted)">(입금일 기준)</span></div>
    <div class="cal-grid" style="margin-bottom:5px">
      <div class="cal-dow sun">일</div><div class="cal-dow">월</div><div class="cal-dow">화</div><div class="cal-dow">수</div><div class="cal-dow">목</div><div class="cal-dow">금</div><div class="cal-dow sat">토</div>
    </div>
    <div class="cal-grid">${cells}</div>
    <div class="section-label" style="margin:18px 0 10px">이 달 입금 내역 <span>${monthPays.length}건</span></div>
    ${listHtml}
    <button class="btn btn-ghost" data-action="client" data-id="${c.id}" style="margin-top:6px">전체 정산 현황 보기 ›</button>
  </div>`;
}

function savePaymentEdit(pid){
  const p=state.payments.find(x=>x.id===pid); if(!p) return;
  const amount=parseWon($('#pe-amount').value);
  if(!amount){ toast('입금액을 입력하세요'); return; }
  const updated={...p,
    payDate:$('#pe-date').value||p.payDate,
    targetMonth:$('#pe-month').value||p.targetMonth,
    amount,
    method:$('#pe-methodv').value,
    memo:$('#pe-memo').value.trim()
  };
  const i=state.payments.findIndex(x=>x.id===pid); if(i>=0) state.payments[i]=updated; // 즉시 반영
  Store.savePayment(updated);
  const ret=editReturn||{id:p.clientId,month:updated.payDate.slice(0,7)};
  closeModal(); toast('수정되었습니다');
  setTimeout(()=>openPaymentCalendar(ret.id, ret.month),90);
}

function deletePaymentFromCal(pid){
  if(!confirm('이 입금 내역을 삭제할까요?')) return;
  const p=state.payments.find(x=>x.id===pid);
  const ret=editReturn||(p?{id:p.clientId,month:(p.payDate||'').slice(0,7)}:null);
  state.payments=state.payments.filter(x=>x.id!==pid); // 즉시 반영
  Store.delPayment(pid);
  closeModal(); toast('삭제되었습니다');
  if(ret) setTimeout(()=>openPaymentCalendar(ret.id, ret.month),90);
}

// 입금 폼: 선택된 거래처+월 기준으로 청구/기입금/잔액 힌트 갱신 & 입금액 기본값(잔액) 세팅
function updatePayHint(setAmount){
  const cid=$('#p-client')?.value, mm=$('#p-month')?.value;
  const c=state.clients.find(x=>x.id===cid); if(!c) return;
  const bill=billOf(c), already=paidForClientMonth(c.id,mm), remain=Math.max(0,bill-already);
  if(setAmount){ const a=$('#p-amount'); if(a) a.value=remain?won(remain):''; }
  const h=$('#payHint'); if(!h) return;
  const entered=parseWon($('#p-amount')?.value||'');
  let base=`${mLabel(mm)}분 청구 ${won(bill)}원 (부가세 포함)${already>0?` · 기입금 ${won(already)}원`:''}`;
  if(remain>0) base+=` · <b style="color:var(--red)">잔액 ${won(remain)}원</b>`;
  else if(bill>0) base+=` · <b style="color:var(--green)">완납된 달입니다</b>`;
  if(entered>0 && remain>0){
    const after=remain-entered;
    if(after>0) base+=`<br><span style="color:var(--amber);font-weight:700">▸ 분할 납부 · 이 입금 후 잔액 ${won(after)}원 남음</span>`;
    else if(after===0) base+=`<br><span style="color:var(--green);font-weight:700">▸ 이 입금으로 이 달은 완납됩니다</span>`;
    else base+=`<br><span style="color:var(--muted)">▸ 잔액보다 ${won(-after)}원 많은 초과 입금입니다</span>`;
  }
  // 이 달에 이미 등록된 입금 내역 표시 + 같은 금액 중복 경고
  const {pays}=monthPayList(c.id,mm);
  if(pays.length){
    base+=`<br><span style="color:var(--muted)">▸ 이미 등록된 입금 · ${pays.map(p=>`${mmdd(p.payDate)} ${won(p.amount)}원`).join(', ')}</span>`;
    if(entered>0 && pays.some(p=>(+p.amount||0)===entered)){
      base+=`<br><span style="color:var(--red);font-weight:800">⚠ 같은 금액(${won(entered)}원)이 이 달에 이미 입금 처리돼 있습니다 — 중복 입력이 아닌지 확인하세요</span>`;
    }
  }
  h.innerHTML=base;
}

function menuSheet(){
  return `

  <div class="modal-body">

      <div style="font-size:13px;color:var(--muted);line-height:1.55">${USE_FB?'Firebase에 연결되어 여러 기기에서 실시간으로 공유됩니다.':'Firebase 설정을 입력하면 여러 기기에서 함께 관리할 수 있어요. 그 전까지는 이 브라우저에만 저장됩니다.'}</div>
    </div>
    <button class="btn btn-ghost" data-action="export" style="margin-bottom:10px">📤 데이터 백업 (JSON 내보내기)</button>
    <button class="btn btn-ghost" data-action="importbtn" style="margin-bottom:10px">📥 백업 복원 (JSON 불러오기)</button>
    <input type="file" id="importFile" accept="application/json" class="hidden">
    ${USE_FB?`<button class="btn btn-ghost" data-action="staffmgr" style="margin-bottom:10px">👥 직원 계정 관리 (${state.users.filter(u=>u.active!==false).length}명)</button>
    <button class="btn btn-ghost" data-action="pwchange" style="margin-bottom:10px">🔑 관리자 비밀번호 변경</button>
    <button class="btn btn-ghost" data-action="logout">로그아웃</button>`:''}
    <div style="text-align:center;font-size:12px;color:var(--muted);margin-top:14px">거래처 ${state.clients.length}곳 · 입금 ${state.payments.length}건 · 부수작업 ${state.extras.length}건</div>
    ${changelogHtml()}
  </div>`;
}

/* ---------- helpers ---------- */
function esc(s){ return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function parseWon(v){ return +String(v).replace(/[^0-9]/g,'')||0; }
function toast(msg,ms){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),ms||1900); }

// live formatting for inputs
document.addEventListener('input',e=>{
  if(e.target.matches('#f-fee,#p-amount')){
    const v=parseWon(e.target.value);
    e.target.value=v?won(v):'';
    if(e.target.id==='f-fee'){
      const pv=$('#feePreview');
      if(pv) pv.innerHTML=v?`부가세 ${won(vatOf(v))}원 · <b style="color:var(--primary)">월 청구액 ${won(withVat(v))}원</b> (완납 기준)`:'공급가를 입력하면 부가세 포함 청구액이 표시됩니다';
    }
  }
  if(e.target.id==='f-phone'){

  }
  if(e.target.id==='p-amount'){ updatePayHint(false); }
  if(e.target.id==='ex-amount'){
    const v=parseWon(e.target.value);
    e.target.value=v?won(v):'';
    const pv=$('#exFeePreview'); if(pv) pv.innerHTML=exFeeText(v, $('#ex-vatv')?.value||'add');

});

function saveClientForm(){
  const name=$('#f-name').value.trim();
  if(!name){ toast('상호명을 입력하세요'); return; }
  const id=$('#f-id').value||uid();
  const existing=state.clients.find(c=>c.id===id);
  const c={
    id, name,
    manager:$('#f-manager').value.trim(),
    phone:$('#f-phone').value.trim(),
    contractDate:$('#f-date').value||todayISO(),
    monthlyFee:parseWon($('#f-fee').value),
    status:$('#f-statusv').value,
    endDate:$('#f-end')?.value||'',
    memo:$('#f-memo').value.trim(),
    createdAt:existing?.createdAt||Date.now()
  };
  const items=collectPlanItems();
  const pkg=$('#f-pkg')?.value||'';
  const keywords=($('#f-kw')?.value||'').trim();
  Store.saveClient(c);
  if(items.length || keywords || state.plans[id]){
    const plan={clientId:id, name:c.name, status:c.status, contractDate:c.contractDate, endDate:c.endDate, pkg:items.length?(pkg||'custom'):'', items, keywords, extra:(state.plans[id]||{}).extra||{}, updatedAt:Date.now()};
    state.plans[id]=plan;
    Store.savePlan(plan).catch(e=>toast('월 작업 구성 저장 실패: '+(e.code||e.message),3000));
  }
  closeModal(); render(); toast(existing?'저장되었습니다':'거래처가 등록되었습니다');
}
function savePaymentForm(){
  const clientId=$('#p-client').value;
  const amount=parseWon($('#p-amount').value);
  if(!clientId){ toast('거래처를 선택하세요'); return; }
  if(!amount){ toast('입금액을 입력하세요'); return; }
  const tMonth=$('#p-month').value||state.month;
  // 같은 달에 같은 금액이 이미 등록돼 있으면 중복 여부를 한 번 더 확인
  const sameAmt=monthPayList(clientId,tMonth).pays.filter(x=>(+x.amount||0)===amount);
  if(sameAmt.length){
    const cc=state.clients.find(x=>x.id===clientId);
    if(!confirm(`${cc?cc.name+' · ':''}${mLabel(tMonth)}\n같은 금액 ${won(amount)}원이 이미 입금 처리돼 있습니다 (${sameAmt.map(x=>x.payDate).join(', ')}).\n\n중복 입력이 아닌지 확인하세요.\n그래도 등록할까요?`)) return;
  }
  const p={
    id:uid(), clientId,
    payDate:$('#p-date').value||todayISO(),
    targetMonth:tMonth,
    amount,
    method:$('#p-methodv').value,
    memo:$('#p-memo').value.trim(),
    createdAt:Date.now()
  };
  Store.savePayment(p);
  const back=payReturnClient; payReturnClient=null;
  closeModal(); toast('입금이 등록되었습니다');
  if(back){ setTimeout(()=>{ const c=state.clients.find(x=>x.id===back); if(c) showClientDetail(c); },140); }
}

// 미납/부분인 모든 달을 잔액만큼 한 번에 완납 처리 (과거 광고비 일괄 입력)
// 1단계: 입금일·방법 선택 모달
function settleAllForm(clientId){
  const c=state.clients.find(x=>x.id===clientId); if(!c) return '';
  const board=clientMonthBoard(c).filter(x=>x.remain>0);
  if(!board.length){ toast('미납된 달이 없습니다'); return ''; }
  const total=board.reduce((a,x)=>a+x.remain,0);
  const first=mLabel(board[board.length-1].m), last=mLabel(board[0].m);
  return `
  <div class="modal-hd"><h2>미납 일괄 완납 처리</h2><button class="x" data-action="close">✕</button></div>
  <div class="modal-body">
    <div class="card" style="padding:4px 14px;margin-bottom:14px">
      <div class="dl"><span class="k">거래처</span><span class="v">${esc(c.name)}</span></div>
      <div class="dl"><span class="k">대상 기간</span><span class="v">${first} ~ ${last} · ${board.length}개월</span></div>
      <div class="dl"><span class="k">합계 (부가세 포함)</span><span class="v num" style="color:var(--primary)">${won(total)}원</span></div>
    </div>
    <div class="two-col">
      <div class="field"><label>입금일</label><input id="sa-date" type="date" value="${todayISO()}"></div>
      <div class="field"><label>입금 방법</label>
        <select id="sa-method">${['계좌이체','현금','카드'].map(mm=>`<option value="${mm}">${mm}</option>`).join('')}</select>
      </div>
    </div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:12px">처리 후에도 거래처 상세에서 '일괄 완납 취소'로 되돌릴 수 있습니다.</div>
    <button class="btn btn-primary" data-action="settleallok" data-id="${c.id}">✓ ${board.length}개월 완납 처리</button>
  </div>`;
}
// 2단계: 실제 처리 (한 번에 만든 건들은 batchId로 묶어 나중에 통째로 취소 가능)
function settleAllUnpaid(clientId){
  const c=state.clients.find(x=>x.id===clientId); if(!c) return;
  const board=clientMonthBoard(c).filter(x=>x.remain>0);
  if(!board.length){ toast('미납된 달이 없습니다'); return; }
  const payDate=($('#sa-date')?.value)||todayISO();
  const method=($('#sa-method')?.value)||'계좌이체';
  const batchId=uid();
  board.forEach((x,i)=>{
    const p={
      id:uid(), clientId, batchId,
      payDate, targetMonth:x.m, amount:x.remain,
      method, memo:'과거분 일괄 정산',
      createdAt:Date.now()+i
    };
    if(!state.payments.some(q=>q.id===p.id)) state.payments.push(p); // 즉시 반영
    Store.savePayment(p);
  });
  closeModal(); toast(`${board.length}개월 완납 처리했습니다`);
  setTimeout(()=>{ const cc=state.clients.find(x=>x.id===clientId); if(cc) showClientDetail(cc); },160);
}
// 이 거래처의 가장 최근 일괄 완납 묶음
function latestBatch(clientId){
  const bp=state.payments.filter(p=>p.clientId===clientId && p.batchId);
  if(!bp.length) return null;
  const latest=bp.reduce((a,p)=>(p.createdAt||0)>(a.createdAt||0)?p:a);
  const pays=bp.filter(p=>p.batchId===latest.batchId);
  return {batchId:latest.batchId, date:latest.payDate||'', pays, total:pays.reduce((a,p)=>a+(+p.amount||0),0)};
}
// 일괄 완납 취소: 그 묶음으로 만들어진 입금 건을 모두 삭제
function undoBatchSettle(clientId){
  const b=latestBatch(clientId); if(!b){ toast('취소할 일괄 완납 내역이 없습니다'); return; }
  if(!confirm(`${b.date}에 일괄 완납 처리한 ${b.pays.length}건(${won(b.total)}원)을 모두 취소할까요?\n해당 달은 다시 미납으로 돌아갑니다.`)) return;
  const ids=new Set(b.pays.map(p=>p.id));
  state.payments=state.payments.filter(p=>!ids.has(p.id)); // 즉시 반영
  b.pays.forEach(p=>Store.delPayment(p.id));
  toast('일괄 완납을 취소했습니다');
  setTimeout(()=>{ const cc=state.clients.find(x=>x.id===clientId); if(cc) showClientDetail(cc); },160);
}

function exportData(){
  const data={clients:state.clients,payments:state.payments,extras:state.extras,plans:Object.values(state.plans),logs:state.logs,settings:state.settings,appVersion:APP_VERSION,exportedAt:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url;
  a.download=`스테이유_광고비_백업_${todayISO()}.json`; a.click();
  URL.revokeObjectURL(url); closeModal(); toast('백업 파일을 저장했습니다');
}
function importData(file){
  if(!file) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const o=JSON.parse(r.result); if(!confirm(`거래처 ${(o.clients||[]).length}곳, 입금 ${(o.payments||[]).length}건, 부수작업 ${(o.extras||[]).length}건을 불러올까요? 현재 데이터를 덮어씁니다.`)) return; Store.importData(o); closeModal(); render(); toast('복원되었습니다'); }catch(err){ toast('파일을 읽을 수 없습니다'); } };
  r.readAsText(file);
}


/* ============================================================
   작업 관리 (v3.0.0) — 팀별 달력 기록 방식
   - 거래처별 '월 작업 구성'(ad_taskplans)이 매달 목표가 됨
   - 직원은 달력 날짜 → 작업 → 업체를 눌러 '완료한 날'을 기록 (ad_logs)
   - 기록이 업체·작업별로 자동 집계 (이번 달 목표 대비 / 이번 주 기록)
   - 팀: 영상팀(video) / 영업팀(sales) — 직원 팀, 작업별 담당 팀은 관리자가 지정
   ============================================================ */
const TEAMS={video:'영상팀', sales:'영업팀'};
const I={
  short:{id:'short', label:'숏폼 영상', type:'sns', count:4},
  long:{id:'long', label:'롱폼 영상', type:'sns', count:1},
  travel:{id:'travel', label:'여수 여행 연관 콘텐츠', type:'simple', count:1},
  seo:{id:'seo', label:'SEO+AEO+GEO 최적화', type:'simple', count:1},
  review:{id:'review', label:'리뷰', type:'count', count:1},
  blog:{id:'blog', label:'블로그', type:'count', count:1},
  brand:{id:'brand', label:'브랜드 콘텐츠 광고', type:'simple', count:1},
  report:{id:'report', label:'보고서', type:'simple', count:1},
};
// 계약서 제5조 제1항 패키지 구성 + 제6조 제2항 월간 보고서
const PACKAGES=[
  {id:'S1', name:'STANDARD 1', items:['review','blog','report']},
  {id:'S2', name:'STANDARD 2', items:['short','long','travel','seo','report']},
  {id:'G',  name:'GROWTH',     items:['short','long','travel','seo','review','blog','report']},
  {id:'P',  name:'PREMIUM',    items:['short','long','travel','seo','review','blog','brand','report']},
];
const DEFAULT_TEAM={shoot:'video', short:'video', long:'video', travel:'video', seo:'sales', review:'sales', blog:'sales', report:'sales', brand:'sales'};
const SHORT_NAME={shoot:'촬영', short:'숏폼', long:'롱폼', travel:'여행콘텐츠', seo:'SEO', review:'리뷰', blog:'블로그', report:'보고서', brand:'브랜드광고'};
const KEY_ORDER=['shoot','short','long','travel','seo','review','blog','brand','report'];
const URGENT_DAYS=7;   // 이번 달 마감 며칠 전부터 못 채운 작업을 빨간색으로 보일지
const WD=['일','월','화','수','목','금','토'];
const pkgName=id=>(PACKAGES.find(p=>p.id===id)||{}).name||'직접 설정';
const pkgItems=id=>((PACKAGES.find(p=>p.id===id)||{}).items||[]).map(k=>({...I[k]}));
const TASK_PRESETS=['short','long','travel','seo','review','blog','brand','report'].map(k=>I[k]);
const tKey=t=>t==='simple'?'simple':t==='count'?'count':'sns';
const taskKeyOf=it=>I[it.id]?it.id:'c:'+String(it.label||'').trim();
const keyLabel=k=>k==='shoot'?'촬영':I[k]?I[k].label:String(k).replace(/^c:/,'');
const keyShort=k=>SHORT_NAME[k]||String(k).replace(/^c:/,'');
const keyRank=k=>{ const i=KEY_ORDER.indexOf(k); return i<0?100:i; };
const sortKeys=ks=>[...new Set(ks)].sort((a,b)=>keyRank(a)-keyRank(b)||a.localeCompare(b,'ko'));
const hasPlan=id=>{ const p=state.plans[id]; return !!(p && (p.items||[]).length); };
let workUI={day:null, step:'day', key:null, editId:null, cell:null};

/* ---------- 팀 ---------- */
function teamOfKey(k){
  const s=(state.settings&&state.settings.taskTeams)||{};
  if(s[k]) return s[k];
  if(DEFAULT_TEAM[k]) return DEFAULT_TEAM[k];
  const it=Object.values(state.plans).flatMap(p=>p.items||[]).find(x=>taskKeyOf(x)===k);
  return it && tKey(it.type)==='sns' ? 'video' : 'sales';
}
function viewTeam(){ // 지금 보고 있는 팀 ('all' | 'video' | 'sales')
  if(state.role==='staff') return TEAMS[state.me.team]?state.me.team:'all';
  return state.workTeam||'all';
}
const inTeam=(k,team)=>team==='all'||teamOfKey(k)===team;

/* ---------- 목표·기록 집계 ---------- */
function activePlans(m){
  return Object.values(state.plans).filter(p=>p.clientId && hasPlan(p.clientId) && isActiveInMonth(p,m))
    .sort((a,b)=>(a.name||'').localeCompare(b.name||'','ko'));
}
// 업체의 그 달 목표: key → {label, target, kind}  (kind: multi=여러 편, once=한 번 완료, shoot=횟수만)
function targetsOf(p,m){
  const out={};
  (p.items||[]).forEach(it=>{
    const k=taskKeyOf(it), t=tKey(it.type);
    const n=t==='sns'?(+it.count||0):1;
    if(!out[k]) out[k]={label:it.label||keyLabel(k), target:0, kind:t==='sns'?'multi':'once'};
    out[k].target+=n;
    if(t==='sns') out[k].kind='multi';
  });
  const ex=+((p.extra||{})[m])||0;
  if(ex){
    [['short',4],['long',1]].forEach(([k,n])=>{ if(!out[k]) out[k]={label:I[k].label,target:0,kind:'multi'}; out[k].target+=n*ex; out[k].kind='multi'; });
  }
  Object.keys(out).forEach(k=>{ if(out[k].kind==='once') out[k].target=1; });
  if(Object.keys(out).some(k=>teamOfKey(k)==='video')) out.shoot={label:'촬영', target:0, kind:'shoot'};
  return out;
}
const logsIn=(m)=>state.logs.filter(l=>l.month===m);
function doneOf(cid,k,m){ return state.logs.filter(l=>l.month===m && l.clientId===cid && l.key===k).length; }
function cellState(done,t,m){
  if(t.kind==='shoot') return done?'green':'gray';
  if(done>=t.target) return 'green';
  const dl=daysLeftIn(m);
  if(dl<0 || dl<=URGENT_DAYS) return 'red';
  return done>0?'amber':'gray';
}
function daysLeftIn(m){
  const now=nowMonth(); if(m<now) return -1; if(m>now) return 99;
  const d=new Date(); return new Date(d.getFullYear(),d.getMonth()+1,0).getDate()-d.getDate();
}
function monthSummary(m,team){
  let need=0, got=0; const missing=[];
  activePlans(m).forEach(p=>{
    const ts=targetsOf(p,m);
    Object.entries(ts).forEach(([k,t])=>{
      if(t.kind==='shoot' || !inTeam(k,team)) return;
      const d=doneOf(p.clientId,k,m);
      need+=t.target; got+=Math.min(d,t.target);
      if(d<t.target) missing.push({p,k,t,d});
    });
  });
  return {need,got,missing};
}
function teamKeysFor(m,team){
  const ks=[];
  activePlans(m).forEach(p=>Object.keys(targetsOf(p,m)).forEach(k=>{ if(inTeam(k,team)) ks.push(k); }));
  return sortKeys(ks);
}

/* ---------- 날짜 도우미 ---------- */
const isoOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseIso=s=>{ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const dayTitle=iso=>{ const d=parseIso(iso); return `${d.getMonth()+1}월 ${d.getDate()}일 (${WD[d.getDay()]})`; };
function weekStartOf(iso){ const d=parseIso(iso); const w=(d.getDay()+6)%7; d.setDate(d.getDate()-w); return isoOf(d); } // 월요일 시작
function addDays(iso,n){ const d=parseIso(iso); d.setDate(d.getDate()+n); return isoOf(d); }
function fmtAt(ts){ if(!ts) return ''; const d=new Date(ts); return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }

/* ---------- 저장 ---------- */
async function addLog(date,key,cid){
  const p=state.plans[cid]; if(!p) return;
  const l={id:uid(), date, month:date.slice(0,7), clientId:cid, clientName:p.name||'', key, label:keyLabel(key)==='촬영'?'촬영':(targetsOf(p,date.slice(0,7))[key]||{}).label||keyLabel(key), team:teamOfKey(key), by:state.me.name, byUid:state.me.uid, at:Date.now()};
  state.logs.push(l); render();
  try{ await Store.saveLog(l); toast(`${p.name} · ${keyShort(key)} 기록했습니다`); }
  catch(e){ state.logs=state.logs.filter(x=>x.id!==l.id); render(); toast('저장 실패: '+(e.code||e.message),3000); }
}
async function updateLog(id,patch){
  const old=state.logs.find(l=>l.id===id); if(!old) return;
  const p=state.plans[patch.clientId||old.clientId];
  const nl={...old,...patch, month:(patch.date||old.date).slice(0,7), clientName:p?p.name:old.clientName, editedBy:state.me.name, editedAt:Date.now()};
  if(patch.key) { nl.label=keyLabel(patch.key); nl.team=teamOfKey(patch.key); if(p){ const t=targetsOf(p,nl.month)[patch.key]; if(t) nl.label=t.label; } }
  state.logs=state.logs.map(l=>l.id===id?nl:l); render();
  try{ await Store.saveLog(nl); toast('수정했습니다'); }
  catch(e){ state.logs=state.logs.map(l=>l.id===id?old:l); render(); toast('저장 실패: '+(e.code||e.message),3000); }
}
async function removeLog(id){
  const old=state.logs.find(l=>l.id===id); if(!old) return;
  if(!confirm(`${dayTitle(old.date)} · ${old.clientName} · ${keyShort(old.key)}\n이 기록을 지울까요?`)) return;
  state.logs=state.logs.filter(l=>l.id!==id);
  workUI.editId=null; workUI.step=workUI.day?'day':workUI.step;
  render();
  try{ await Store.delLog(id); toast('지웠습니다'); }
  catch(e){ state.logs.push(old); render(); toast('삭제 실패: '+(e.code||e.message),3000); }
}
const canEditLog=l=>state.role==='admin' || !TEAMS[state.me.team] || l.team===state.me.team;

/* ---------- 작업 화면 (관리자 '작업' 탭 · 직원 첫 화면 공용) ---------- */
function viewWorkBoard(){
  const m=state.month, team=viewTeam(), isAdm=state.role==='admin';
  const sum=monthSummary(m,team);
  const pct=sum.need?Math.round(sum.got/sum.need*100):0;
  const noPlan=isAdm?state.clients.filter(c=>c.status!=='ended' && isActiveInMonth(c,m) && !hasPlan(c.id)).sort((a,b)=>(a.name||'').localeCompare(b.name||'','ko')):[];
  return `<div class="view wk">
    <div class="wk-top">
      <div class="month-nav wk-mnav">
        <button data-action="mprev">‹</button>
        <div class="mlabel">${mLabel(m)}<small>${isAdm?'작업 달력':`${esc(state.me.name)}님 · ${TEAMS[team]||'전체 작업'}`}</small></div>
        <button data-action="mnext">›</button>
      </div>
      ${isAdm?`<div class="teamseg">${[['all','전체'],['video','영상팀'],['sales','영업팀']].map(([v,t])=>`<button data-action="wkteam" data-v="${v}" class="${team===v?'on':''}">${t}</button>`).join('')}</div>`:''}
      <div class="wk-prog"><div class="wk-prog-t"><b class="num">${sum.got}</b> / ${sum.need} 완료${m===nowMonth()?` · 마감까지 ${daysLeftIn(m)}일`:''}${sum.missing.length?` · <span style="color:var(--red)">남은 ${sum.missing.length}건</span>`:''}</div><div class="pbar"><i class="${sum.missing.length?'':'green'}" style="width:${pct}%"></i></div></div>
    </div>
    ${calendarHtml(m,team)}
    ${summaryHtml(m,team)}
    ${noPlan.length?`<div class="section-label">월 작업 구성 미설정 <span>${noPlan.length}곳</span></div>
      <div style="font-size:12.5px;color:var(--muted);margin:0 4px 10px;line-height:1.55">매달 할 작업이 정해져 있지 않아 달력에 업체가 나오지 않는 거래처예요. 눌러서 월 작업 구성을 정해 주세요.</div>
      <div class="wk-noplan">${noPlan.map(c=>`<button class="row" data-action="editclient" data-id="${c.id}">
        <div class="avatar" style="background:${colorFor(c.name)}">${initial(c.name)}</div>
        <div class="body"><div class="name">${esc(c.name)}</div><div class="meta">월 작업 구성 정하기 ›</div></div></button>`).join('')}</div>`:''}
  </div>`;
}
function calendarHtml(m,team){
  const [y,mo]=m.split('-').map(Number);
  const first=new Date(y,mo-1,1), days=new Date(y,mo,0).getDate();
  const lead=first.getDay(), today=todayISO();
  const byDay={};
  logsIn(m).filter(l=>inTeam(l.key,team)).forEach(l=>{ (byDay[l.date]=byDay[l.date]||[]).push(l); });
  let cells='';
  for(let i=0;i<lead;i++) cells+=`<div class="wc empty"></div>`;
  for(let d=1; d<=days; d++){
    const iso=`${m}-${pad(d)}`, wd=(lead+d-1)%7;
    const ls=(byDay[iso]||[]).sort((a,b)=>keyRank(a.key)-keyRank(b.key)||(a.clientName||'').localeCompare(b.clientName||'','ko')||a.at-b.at);
    const MAX=4;
    cells+=`<button class="wc ${iso===today?'today':''} ${wd===0?'sun':wd===6?'sat':''}" data-action="wkday" data-d="${iso}">
      <span class="wc-n">${d}</span>
      ${ls.slice(0,MAX).map(l=>`<span class="wc-e t-${teamOfKey(l.key)}"><b>${esc(keyShort(l.key))}</b> · ${esc(l.clientName)}</span>`).join('')}
      ${ls.length>MAX?`<span class="wc-more">+${ls.length-MAX}건 더</span>`:''}
      ${ls.length?`<span class="wc-dot">${ls.length}</span>`:''}
    </button>`;
  }
  return `<div class="wcal-wrap"><div class="wcal-hint">날짜를 눌러 그날 한 작업을 기록하세요</div>
    <div class="wcal">${WD.map((w,i)=>`<div class="wh ${i===0?'sun':i===6?'sat':''}">${w}</div>`).join('')}${cells}</div></div>`;
}
function summaryHtml(m,team){
  const mode=state.sumMode||'month';
  const plans=activePlans(m);
  const keys=teamKeysFor(m,team);
  const tabs=`<div class="sumseg"><button data-action="summode" data-v="month" class="${mode==='month'?'on':''}">이번 달 집계</button><button data-action="summode" data-v="week" class="${mode==='week'?'on':''}">주간 기록</button></div>`;
  if(!plans.length) return `<div class="section-label" style="margin-top:20px">집계</div>${tabs}<div class="card" style="padding:22px;text-align:center;color:var(--muted);font-size:13.5px">${mLabel(m)}에 월 작업 구성이 있는 거래처가 없습니다</div>`;
  if(mode==='week') return weekHtml(m,team,keys,plans,tabs);
  const sum=monthSummary(m,team);
  const rows=plans.map(p=>{
    const ts=targetsOf(p,m);
    if(!Object.keys(ts).some(k=>inTeam(k,team))) return '';
    return `<tr><th class="sticky-c"><span class="cn">${esc(p.name)}</span><small>${p.pkg&&p.pkg!=='custom'?pkgName(p.pkg):'직접 설정'}${+((p.extra||{})[m])?` · 추가 ${p.extra[m]}`:''}</small></th>${keys.map(k=>{
      const t=ts[k]; if(!t) return `<td class="na">·</td>`;
      const d=doneOf(p.clientId,k,m), cls=cellState(d,t,m);
      const txt=t.kind==='shoot'?`${d}회`:t.kind==='once'?(d?'✓':'–'):`${d}/${t.target}`;
      return `<td><button class="mc ${cls}" data-action="wkcell" data-c="${p.clientId}" data-k="${esc(k)}">${txt}</button></td>`;
    }).join('')}</tr>`;
  }).join('');
  return `<div class="section-label" style="margin-top:20px">집계 <span>${mLabel(m)}</span></div>${tabs}
    ${sum.missing.length?`<div class="miss"><div class="miss-h">${daysLeftIn(m)<0?'못 채운 작업':'아직 남은 작업'} ${sum.missing.length}건</div>${sum.missing.map(x=>`<button class="miss-i ${cellState(x.d,x.t,m)}" data-action="wkcell" data-c="${x.p.clientId}" data-k="${esc(x.k)}">${esc(x.p.name)} · ${esc(keyShort(x.k))} <b>${x.t.kind==='once'?'미완료':`${x.d}/${x.t.target}`}</b></button>`).join('')}</div>`
      :`<div class="miss ok">✓ ${mLabel(m)} 작업을 모두 채웠습니다</div>`}
    <div class="mtx-wrap"><table class="mtx"><thead><tr><th class="sticky-c">업체</th>${keys.map(k=>`<th><span class="t-${teamOfKey(k)}">${esc(keyShort(k))}</span></th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>
    <div class="legend-row"><span><i style="background:var(--green)"></i>채움</span><span><i style="background:#d08a2c"></i>진행 중</span><span><i style="background:var(--gray)"></i>아직 없음</span><span><i style="background:var(--red)"></i>마감 임박·못 채움</span></div>
    <div class="wcal-hint" style="text-align:center">숫자를 누르면 그 작업의 기록을 보고 고칠 수 있어요</div>`;
}
function weekHtml(m,team,keys,plans,tabs){
  let ws=state.weekStart;
  const today=todayISO();
  if(!ws || (ws.slice(0,7)!==m && addDays(ws,6).slice(0,7)!==m)) ws=weekStartOf(m===nowMonth()?today:`${m}-01`);
  state.weekStart=ws;
  const we=addDays(ws,6);
  const wl=state.logs.filter(l=>l.date>=ws && l.date<=we && inTeam(l.key,team));
  const cnt=(cid,k)=>wl.filter(l=>l.clientId===cid && l.key===k).length;
  const wkKeys=sortKeys([...keys,...wl.map(l=>l.key)]);
  const rows=plans.filter(p=>Object.keys(targetsOf(p,m)).some(k=>inTeam(k,team)) || wl.some(l=>l.clientId===p.clientId)).map(p=>{
    const has=wkKeys.some(k=>cnt(p.clientId,k));
    return `<tr class="${has?'':'dim'}"><th class="sticky-c"><span class="cn">${esc(p.name)}</span></th>${wkKeys.map(k=>{ const n=cnt(p.clientId,k); return `<td>${n?`<span class="mc wk">${n}</span>`:'<span class="na">·</span>'}</td>`; }).join('')}</tr>`;
  }).join('');
  const byDay={}; wl.forEach(l=>{ (byDay[l.date]=byDay[l.date]||[]).push(l); });
  const list=Object.keys(byDay).sort().map(d=>`<div class="wl-day"><div class="wl-d">${dayTitle(d)}</div>${byDay[d].sort((a,b)=>keyRank(a.key)-keyRank(b.key)).map(l=>`<button class="wl-i" data-action="wkedit" data-id="${l.id}"><span class="t-${teamOfKey(l.key)}">${esc(keyShort(l.key))}</span> ${esc(l.clientName)}<small>${esc(l.by||'')}</small></button>`).join('')}</div>`).join('');
  return `<div class="section-label" style="margin-top:20px">집계 <span>주간</span></div>${tabs}
    <div class="month-nav wk-wnav"><button data-action="wkprev">‹</button><div class="mlabel">${mmdd(ws)} ~ ${mmdd(we)}<small>이번 주 기록 ${wl.length}건</small></div><button data-action="wknext">›</button></div>
    ${wl.length?`<div class="mtx-wrap"><table class="mtx"><thead><tr><th class="sticky-c">업체</th>${wkKeys.map(k=>`<th><span class="t-${teamOfKey(k)}">${esc(keyShort(k))}</span></th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>
      <div class="wl">${list}</div>`
    :`<div class="card" style="padding:22px;text-align:center;color:var(--muted);font-size:13.5px">이 주에는 기록이 없습니다</div>`}`;
}

/* ---------- 날짜 창: 그날 기록 / 작업 고르기 / 업체 고르기 ---------- */
// openModal()이 이전 창 상태를 지우므로, 창을 연 뒤에 상태를 넣고 내용을 그림
function openWorkModal(ui){ openModal('<div class="wk-sheet"></div>'); workUI={day:null,step:'day',key:null,editId:null,cell:null,...ui}; refreshWorkModal(); }
function openDay(iso){ openWorkModal({day:iso}); }
function workModalHtml(){
  if(workUI.editId) return editLogHtml(workUI.editId);
  if(workUI.cell) return cellLogsHtml(workUI.cell.c, workUI.cell.k);
  if(workUI.step==='client') return pickClientHtml(workUI.day, workUI.key);

}
function refreshWorkModal(){
  const modal=document.querySelector('#modalBg .modal');
  if(!modal || !modal.querySelector('.wk-sheet')) return;
  const ae=document.activeElement;

/* ---------- 추가 항목 (제5조 제3항: 추가 촬영 + 숏폼 4편 + 롱폼 1편, 1회성) ---------- */
async function changeExtra(cid,delta){
  const p=state.plans[cid]; if(!p){ toast('먼저 월 작업 구성을 정해 주세요'); return; }
  const m=nowMonth(), cur=+((p.extra||{})[m])||0;
  if(delta>0 && !confirm(`${p.name} · ${mLabel(m)}에 추가 항목(숏폼 4편 + 롱폼 1편)을 넣을까요?\n이번 달 목표에만 더해집니다.`)) return;
  if(delta<0 && !confirm(`${p.name} · ${mLabel(m)} 추가 항목 1회를 뺄까요?`)) return;
  const np={...p, extra:{...(p.extra||{}), [m]:Math.max(0,cur+delta)}};
  state.plans[cid]=np; render();
  try{ await Store.savePlan(np); toast(delta>0?'추가 항목을 넣었습니다':'추가 항목을 뺐습니다'); }
  catch(e){ state.plans[cid]=p; render(); toast('저장 실패: '+(e.code||e.message),3000); }
}
function planSummary(id){
  const p=state.plans[id]; if(!hasPlan(id)) return '';
  const parts=(p.items||[]).map(it=>tKey(it.type)==='sns'?`${it.label} ${it.count}편`:it.label);
  return `${pkgName(p.pkg)} · ${parts.join(', ')}`;
}

function collectPlanItems(){
  return [...document.querySelectorAll('#tpList .tp-row')].map(r=>{

async function createStaffFromForm(){
  const name=$('#st-name').value.trim(), loginId=$('#st-id').value.trim().toLowerCase(), pw=$('#st-pw').value;
  if(!name){ toast('이름을 입력하세요'); return; }
  if(!/^[a-z0-9._-]{3,20}$/.test(loginId)){ toast('아이디는 영문 소문자·숫자 3~20자로 입력하세요',2600); return; }
  if(loginId===ADMIN_ID){ toast('admin은 관리자 아이디라 쓸 수 없습니다'); return; }
  if(pw.length<6){ toast('비밀번호는 6자 이상이어야 합니다'); return; }
  if(!USE_FB){ toast('클라우드 연결 상태에서만 직원 계정을 만들 수 있습니다'); return; }
  const btn=$('#addStaffBtn'); if(btn){ btn.disabled=true; btn.textContent='만드는 중…'; }
  try{
    if(!secAuth) secAuth=getAuth(initializeApp(FIREBASE_CONFIG,'staff-creator'));
    const cred=await createUserWithEmailAndPassword(secAuth, idToEmail(loginId), pw);
    await signOut(secAuth);
    const u={uid:cred.user.uid, loginId, name, active:true, role:'staff', team:($('#st-team')?.value)||'video', createdAt:Date.now()};
    await setDoc(doc(db,'ad_users',u.uid),u);
    if(!state.users.some(x=>x.uid===u.uid)) state.users.push(u);
    openModal(staffSheet());
    toast(`${name}님 계정을 만들었습니다 · 아이디 ${loginId}`,2800);
  }catch(e){
    if(btn){ btn.disabled=false; btn.textContent='직원 계정 만들기'; }
    toast(authErrMsg(e),3200);
  }
}
async function toggleStaffActive(id){

}

  <div class="modal-body">
    <div class="card" style="padding:14px 16px;margin-bottom:14px;box-shadow:none;background:var(--surface-2)">
      <div style="font-weight:700">${esc(state.me.name)}</div><div style="font-size:12.5px;color:var(--muted)">아이디 ${esc(state.me.loginId||'')}</div>
    </div>
    <button class="btn btn-ghost" data-action="pwchange" style="margin-bottom:10px">🔑 비밀번호 변경</button>
    <button class="btn btn-ghost" data-action="logout">로그아웃</button>
    ${changelogHtml()}
  </div>`;
}

/* ---------- 되돌리기 버튼이 있는 토스트 ---------- */
function toastAction(msg,label,fn,ms){
  document.querySelectorAll('.toast').forEach(x=>x.remove());
  const t=document.createElement('div'); t.className='toast act';
  const sp=document.createElement('span'); sp.textContent=msg;
  const b=document.createElement('button'); b.textContent=label;
  b.addEventListener('click',ev=>{ ev.stopPropagation(); t.remove(); fn(); });
  t.append(sp,b); document.body.appendChild(t);
  setTimeout(()=>t.remove(),ms||5000);
}

/* ---------- 작업 화면 입력 ---------- */
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.classList.contains('tp-type')){ el.closest('.tp-row').dataset.t=el.value; }
});
document.addEventListener('keydown',e=>{ if(e.key==='Enter' && e.target.dataset && e.target.dataset.count) e.target.blur(); });
document.addEventListener('input',e=>{ if(e.target.matches('[data-count]')) e.target.value=e.target.value.replace(/[^0-9]/g,'').slice(0,5);
  if(e.target.matches('.tp-count')) e.target.value=e.target.value.replace(/[^0-9]/g,'').slice(0,2); });

/* ---------- 로그인 (관리자·직원별 계정) ---------- */
let pendingLoginMsg='';
function authErrMsg(e){
  const c=(e&&e.code)||'';
  if(c==='auth/invalid-credential'||c==='auth/wrong-password'||c==='auth/user-not-found'||c==='auth/invalid-email') return '아이디 또는 비밀번호가 맞지 않습니다';
  if(c==='auth/email-already-in-use') return '이미 있는 아이디입니다';
  if(c==='auth/weak-password') return '비밀번호는 6자 이상이어야 합니다';
  if(c==='auth/too-many-requests') return '여러 번 틀려서 잠시 막혔습니다. 조금 뒤 다시 시도하세요';
  if(c==='auth/network-request-failed') return '인터넷 연결을 확인하세요';
  if(c==='auth/configuration-not-found') return 'Firebase 콘솔 → 보안 → Authentication에서 이메일/비밀번호 로그인을 먼저 켜 주세요';
  if(c==='auth/operation-not-allowed') return 'Firebase에서 이메일/비밀번호 로그인을 먼저 켜 주세요';
  return '오류: '+(c||(e&&e.message)||'알 수 없음');
}
function showLogin(mode){
  hideLogin();
  const setup=mode==='setup';
  const el=document.createElement('div'); el.className='lock'; el.id='loginScreen';
  el.innerHTML=`
    <div class="lk-mark"></div>
    <h2>스테이유 광고 관리</h2>
    <p>${setup?'처음 한 번만 · 관리자 비밀번호를 정하세요':'아이디와 비밀번호로 로그인하세요'}</p>
    ${setup?`<form class="lg-form" id="setupForm">
      <input value="관리자 아이디: ${ADMIN_ID}" disabled style="opacity:.75">
      <input id="su-pw" type="password" autocomplete="new-password" placeholder="관리자 비밀번호 (6자 이상)">
      <input id="su-pw2" type="password" autocomplete="new-password" placeholder="비밀번호 확인">
      <div class="lk-msg" id="lgMsg"></div>
      <button class="lg-btn" type="submit">관리자 계정 만들기</button>
    </form>
    <button class="lg-link" data-action="adminback">로그인 화면으로</button>`
    :`<form class="lg-form" id="loginForm">
      <input id="lg-id" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="아이디">
      <input id="lg-pw" type="password" autocomplete="current-password" placeholder="비밀번호">
      <div class="lk-msg" id="lgMsg">${esc(pendingLoginMsg)}</div>
      <button class="lg-btn" type="submit">로그인</button>
    </form>
    <button class="lg-link" data-action="adminsetup">처음 사용 · 관리자 계정 만들기</button>`}`;
  pendingLoginMsg='';
  document.body.appendChild(el);
}
function hideLogin(){ const l=$('#loginScreen'); if(l) l.remove(); }
document.addEventListener('submit',async e=>{
  if(e.target.id==='loginForm'){
    e.preventDefault();
    const id=$('#lg-id').value.trim(), pw=$('#lg-pw').value, msg=$('#lgMsg'), btn=e.target.querySelector('button');
    if(!id||!pw){ msg.textContent='아이디와 비밀번호를 입력하세요'; return; }
    btn.disabled=true; btn.textContent='로그인 중…'; msg.textContent='';
    try{ await signInWithEmailAndPassword(auth, idToEmail(id), pw); }
    catch(err){ msg.textContent=authErrMsg(err); btn.disabled=false; btn.textContent='로그인'; }
  }
  if(e.target.id==='setupForm'){
    e.preventDefault();
    const a=$('#su-pw').value, b=$('#su-pw2').value, msg=$('#lgMsg'), btn=e.target.querySelector('button');
    if(a.length<6){ msg.textContent='비밀번호는 6자 이상이어야 합니다'; return; }
    if(a!==b){ msg.textContent='두 비밀번호가 다릅니다'; return; }
    btn.disabled=true; btn.textContent='만드는 중…';
    try{ await createUserWithEmailAndPassword(auth, ADMIN_EMAIL, a); }
    catch(err){
      msg.textContent = err.code==='auth/email-already-in-use' ? '이미 관리자 계정이 있습니다. 로그인 화면에서 아이디 admin으로 로그인하세요' : authErrMsg(err);
      btn.disabled=false; btn.textContent='관리자 계정 만들기';
    }
  }
});
function resetSession(){
  Store.stop(); closeModal();
  Object.assign(state,{clients:[],payments:[],extras:[],plans:{},users:[],logs:[],settings:{},ready:false,plansLoaded:false,role:null,me:null,workTeam:'all',sumMode:'month',weekStart:null,month:nowMonth(),tab:'dashboard'});
  document.body.classList.remove('staff','wide');
  $('#app').innerHTML='';
}
async function doLogout(){
  if(!USE_FB){ toast('이 기기 저장 모드에서는 로그아웃이 없습니다'); return; }
  closeModal(); await signOut(auth);
}
function onListenError(err){
  if(err && err.code==='permission-denied'){
    if(state.role==='staff'){ pendingLoginMsg='접근 권한이 없습니다. 사용이 중지된 계정일 수 있어요'; signOut(auth); }
    else toast('권한 오류 — Firestore 보안 규칙을 확인하세요',4000);
  } else toast('동기화 오류: '+((err&&err.code)||''),3000);
}
function onDataChange(){ state.ready=true; render(); }
function startSession(role,me){
  hideLogin();
  state.role=role; state.me=me;
  state.tab=role==='admin'?'dashboard':'staff';
  state.month=nowMonth();
  $('#app').innerHTML='<div class="loading"><div class="spinner"></div><span>불러오는 중…</span></div>';
  Store.init(role,onDataChange);
}

/* ---------- Boot ---------- */
function boot(){
  if(!USE_FB){ startSession('admin',{uid:'local',name:'관리자',loginId:ADMIN_ID}); return; }
  let curUid=null;
  onAuthStateChanged(auth, async user=>{
    if(!user){ curUid=null; resetSession(); showLogin(); return; }
    if(user.uid===curUid) return;
    curUid=user.uid;
    if((user.email||'').toLowerCase()===ADMIN_EMAIL){ startSession('admin',{uid:user.uid,name:'관리자',loginId:ADMIN_ID}); return; }
    let me=null;
    try{ const s=await getDoc(doc(db,'ad_users',user.uid)); if(s.exists() && s.data().active!==false) me={uid:user.uid,...s.data()}; }catch(e){}
    if(!me){ pendingLoginMsg='사용이 중지되었거나 등록되지 않은 계정입니다. 관리자에게 문의하세요'; await signOut(auth); return; }
    startSession('staff',me);
  });
}
boot();
</script>
